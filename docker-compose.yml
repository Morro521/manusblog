version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: morroblog-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-morroblog}
      MYSQL_USER: ${MYSQL_USER:-morroblog}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-morroblog123}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - morroblog-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 20s
      retries: 10

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: morroblog-app
    environment:
      NODE_ENV: production
      DATABASE_URL: mysql://${MYSQL_USER:-morroblog}:${MYSQL_PASSWORD:-morroblog123}@mysql:3306/${MYSQL_DATABASE:-morroblog}
      JWT_SECRET: ${JWT_SECRET:-your-secret-key-change-in-production}
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT:-465}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASS: ${SMTP_PASS}
      SMTP_FROM: ${SMTP_FROM}
      INITIAL_ADMIN_EMAIL: ${INITIAL_ADMIN_EMAIL}
      BUILT_IN_FORGE_API_URL: ${BUILT_IN_FORGE_API_URL}
      BUILT_IN_FORGE_API_KEY: ${BUILT_IN_FORGE_API_KEY}
      VITE_FRONTEND_FORGE_API_URL: ${VITE_FRONTEND_FORGE_API_URL}
      VITE_FRONTEND_FORGE_API_KEY: ${VITE_FRONTEND_FORGE_API_KEY}
      VITE_ANALYTICS_ENDPOINT: ${VITE_ANALYTICS_ENDPOINT}
      VITE_ANALYTICS_WEBSITE_ID: ${VITE_ANALYTICS_WEBSITE_ID}
    ports:
      - "3000:3000"
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - morroblog-network
    restart: unless-stopped

volumes:
  mysql_data:
    driver: local

networks:
  morroblog-network:
    driver: bridge
